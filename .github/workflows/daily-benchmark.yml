name: Daily Archic Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/benchmark/**'
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/daily-benchmark.yml'
  schedule:
    # 05:17 UTC hits 07:17 in CEST; 06:17 UTC hits 07:17 in CET.
    # The runner's Madrid-time/idempotency guard executes only the correct window.
    - cron: '17 5,6 * * *'

permissions:
  contents: write

concurrency:
  group: archic-benchmark-daily
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip benchmark]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Detect Chrome
        shell: bash
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "Chrome/Chromium executable not found on runner" >&2
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version
      - name: Validate configuration
        run: npm run validate
      - name: Test benchmark engine
        run: npm test
      - name: Run benchmark
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ARCHIC_AI_PROVIDER: openai
          # Default to the official OpenAI endpoint/model. Both remain overridable
          # through repository variables for any compatible provider we explicitly choose.
          ARCHIC_OPENAI_BASE_URL: ${{ vars.ARCHIC_OPENAI_BASE_URL || 'https://api.openai.com' }}
          ARCHIC_OPENAI_MODEL: ${{ vars.ARCHIC_OPENAI_MODEL || 'gpt-5-mini' }}
          ARCHIC_OPENAI_IMAGE_DETAIL: ${{ vars.ARCHIC_OPENAI_IMAGE_DETAIL }}
          ARCHIC_OPENAI_MAX_OUTPUT_TOKENS: ${{ vars.ARCHIC_OPENAI_MAX_OUTPUT_TOKENS }}
          ARCHIC_REVIEW_MODEL: ${{ vars.ARCHIC_REVIEW_MODEL }}
        run: npm run benchmark
      - name: Persist benchmark report safely
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain=v1 -- data public/screenshots public/api/latest.json | sed -E 's/^.. //')
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No benchmark output changed."
            exit 0
          fi

          snapshot="$RUNNER_TEMP/benchmark-output.tar"
          tar -cf "$snapshot" "${changed[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Persist attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            tar -xf "$snapshot"
            git add -- "${changed[@]}"
            if git diff --cached --quiet; then
              echo "Remote already contains this benchmark output."
              exit 0
            fi
            git commit -m "benchmark daily report"
            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo "Could not persist benchmark output after 3 attempts." >&2
          exit 1
      - name: Hand report to Archic Control
        env:
          ARCHIC_CONTROL_URL: ${{ vars.ARCHIC_CONTROL_URL }}
          CONTROL_INTEGRATION_SECRET: ${{ secrets.CONTROL_INTEGRATION_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ARCHIC_CONTROL_URL:-}" ] || [ -z "${CONTROL_INTEGRATION_SECRET:-}" ]; then
            echo "Archic Control handoff is not configured; scheduled Control sync remains the fallback."
            exit 0
          fi

          endpoint="${ARCHIC_CONTROL_URL%/}/api/integrations/benchmark"
          curl --silent --show-error --fail-with-body \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 45 \
            -X POST "$endpoint" \
            -H "Authorization: Bearer ${CONTROL_INTEGRATION_SECRET}" \
            -H "Content-Type: application/json" \
            --data-binary @data/latest.json
