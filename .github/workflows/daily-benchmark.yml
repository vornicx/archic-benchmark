name: Daily Archic Benchmark

on:
  workflow_dispatch:
  schedule:
    # 05:17 UTC hits 07:17 in CEST; 06:17 UTC hits 07:17 in CET.
    # The runner's Madrid-time/idempotency guard executes only the correct window.
    - cron: '17 5,6 * * *'

permissions:
  contents: write

concurrency:
  group: archic-benchmark-daily
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Detect Chrome
        shell: bash
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "Chrome/Chromium executable not found on runner" >&2
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version
      - name: Validate configuration
        run: npm run validate
      - name: Test benchmark engine
        run: npm test
      - name: Run benchmark
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ARCHIC_AI_PROVIDER: ${{ vars.ARCHIC_AI_PROVIDER }}
          ARCHIC_CURSOR_MODEL: ${{ vars.ARCHIC_CURSOR_MODEL }}
          ARCHIC_OPENAI_MODEL: ${{ vars.ARCHIC_OPENAI_MODEL }}
          ARCHIC_REVIEW_MODEL: ${{ vars.ARCHIC_REVIEW_MODEL }}
        run: npm run benchmark
      - name: Persist benchmark report
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403
        with:
          commit_message: benchmark daily report
          file_pattern: data public/screenshots public/api/latest.json
