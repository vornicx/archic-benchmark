name: Cursor Benchmark Autofix

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project to improve
        required: true
        type: choice
        options:
          - mfinity
          - trenes-y-tranvias
          - marbella-boat-charter
          - marbella-for-sale
          - la-bocana
          - noguera
      max_issues:
        description: Maximum top issues to fix
        required: true
        default: '3'
        type: string

permissions:
  contents: read

concurrency:
  group: cursor-benchmark-autofix-${{ inputs.project }}
  cancel-in-progress: false

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Launch Cursor cloud agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ARCHIC_CURSOR_MODEL: ${{ vars.ARCHIC_CURSOR_MODEL }}
          ARCHIC_CURSOR_FIX_MODEL: ${{ vars.ARCHIC_CURSOR_FIX_MODEL }}
          PROJECT_ID: ${{ inputs.project }}
          MAX_ISSUES: ${{ inputs.max_issues }}
        run: npm run benchmark:autofix -- "$PROJECT_ID" "$MAX_ISSUES"
